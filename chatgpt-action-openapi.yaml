openapi: 3.1.0
info:
  title: Private Filedrop ChatGPT Action
  version: 1.0.0
  description: Import files attached in ChatGPT into Private Filedrop, organize them, and retrieve download links.
servers:
  - url: https://private-filedrop.onrender.com
security:
  - bearerAuth: []
paths:
  /api/chatgpt/import:
    post:
      operationId: importChatGPTFiles
      summary: Import files attached to the current ChatGPT conversation into the filedrop.
      description: Use this when the user asks to save, upload, store, or transfer files they attached to ChatGPT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - openaiFileIdRefs
              properties:
                openaiFileIdRefs:
                  type: array
                  description: Files attached by the user in ChatGPT. Include up to 10 files from the conversation.
                  items:
                    type: string
                category:
                  type: string
                  description: Optional folder/category label.
                tags:
                  type: string
                  description: Optional comma-separated tags.
                note:
                  type: string
                  description: Optional note about the upload.
                project:
                  type: string
                  description: Optional project or repo-like bucket.
                path:
                  type: string
                  description: Optional file path inside the project.
                commitMessage:
                  type: string
                  description: Optional version history message.
      responses:
        "201":
          description: Imported files with filedrop download links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/files:
    get:
      operationId: listFiles
      summary: List files stored in the filedrop.
      responses:
        "200":
          description: Stored files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/files/{id}:
    patch:
      operationId: updateFileMetadata
      summary: Update category, tags, and note for a stored file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                tags:
                  type: string
                note:
                  type: string
                project:
                  type: string
                path:
                  type: string
                commitMessage:
                  type: string
      responses:
        "200":
          description: Updated file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
  /api/files/{id}/chatgpt-return:
    get:
      operationId: returnFileToChatGPT
      summary: Return a stored file into the ChatGPT conversation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File returned to ChatGPT.
          content:
            application/json:
              schema:
                type: object
                properties:
                  openaiFileResponse:
                    type: array
                    items:
                      type: string
                      format: uri
  /api/projects:
    get:
      operationId: listProjects
      summary: List project buckets with current file and version counts.
      responses:
        "200":
          description: Stored projects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectRecord"
  /api/messages:
    get:
      operationId: listMessages
      summary: List mailbox messages for coordinating with another Codex session.
      parameters:
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageRecord"
    post:
      operationId: sendMessage
      summary: Send a mailbox message to another Codex session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                from:
                  type: string
                to:
                  type: string
                body:
                  type: string
                project:
                  type: string
                relatedFileId:
                  type: string
                relatedUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Created message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
  /api/messages/{id}/read:
    patch:
      operationId: markMessageRead
      summary: Mark a mailbox message as read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
  /api/webhooks:
    get:
      operationId: listWebhooks
      summary: List outgoing webhooks.
      responses:
        "200":
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookRecord"
    post:
      operationId: registerWebhook
      summary: Register an outgoing webhook for mailbox events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                to:
                  type: string
                secret:
                  type: string
      responses:
        "201":
          description: Registered webhook. Includes the secret once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRecord"
  /api/webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a test delivery to a webhook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test delivery result.
  /api/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete an outgoing webhook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
  /api/files/{id}/history:
    get:
      operationId: getFileHistory
      summary: Return the version chain for a stored file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    FileRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        uploadedAt:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        note:
          type: string
        project:
          type: string
        path:
          type: string
        version:
          type: integer
        parentId:
          type: string
        commitMessage:
          type: string
        downloadUrl:
          type: string
          format: uri
    ProjectRecord:
      type: object
      properties:
        name:
          type: string
        files:
          type: integer
        versions:
          type: integer
        latestUpload:
          type: string
    MessageRecord:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        body:
          type: string
        createdAt:
          type: string
        project:
          type: string
        relatedFileId:
          type: string
        relatedUrl:
          type: string
          format: uri
        readAt:
          type: string
    WebhookRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        event:
          type: string
        to:
          type: string
        createdAt:
          type: string
        hasSecret:
          type: boolean
        secret:
          type: string
