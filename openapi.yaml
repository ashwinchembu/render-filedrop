openapi: 3.1.0
info:
  title: Private Filedrop API
  version: 1.0.0
  description: API for listing, uploading, and downloading private file-drop documents.
servers:
  - url: https://your-render-service.onrender.com
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check whether the file-drop service is running.
      security: []
      responses:
        "200":
          description: Service status.
  /api/files:
    get:
      operationId: listFiles
      summary: List uploaded files.
      responses:
        "200":
          description: Uploaded files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/upload:
    post:
      operationId: uploadFile
      summary: Upload a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                project:
                  type: string
                path:
                  type: string
                commitMessage:
                  type: string
      responses:
        "201":
          description: Uploaded file metadata.
          content:
            application/json:
                  schema:
                    $ref: "#/components/schemas/FileRecord"
  /api/projects:
    get:
      operationId: listProjects
      summary: List project buckets.
      responses:
        "200":
          description: Project summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectRecord"
  /api/messages:
    get:
      operationId: listMessages
      summary: List mailbox messages for Codex-to-Codex coordination.
      parameters:
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageRecord"
    post:
      operationId: sendMessage
      summary: Send a mailbox message to another session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                from:
                  type: string
                to:
                  type: string
                body:
                  type: string
                project:
                  type: string
                relatedFileId:
                  type: string
                relatedUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Created message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
  /api/messages/{id}/read:
    patch:
      operationId: markMessageRead
      summary: Mark a mailbox message as read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
  /api/channels:
    get:
      operationId: listChannels
      summary: List dedicated conversation channels.
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelRecord"
    post:
      operationId: createChannel
      summary: Create or update a dedicated conversation channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: Channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelRecord"
  /api/channels/{channelId}/messages:
    get:
      operationId: listChannelMessages
      summary: List messages in a dedicated conversation channel.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Channel messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelMessageRecord"
    post:
      operationId: sendChannelMessage
      summary: Post a message to a dedicated conversation channel.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                from:
                  type: string
                body:
                  type: string
                category:
                  type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                relatedFileId:
                  type: string
                relatedUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Channel message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMessageRecord"
  /api/webhooks:
    get:
      operationId: listWebhooks
      summary: List outgoing webhooks.
      responses:
        "200":
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookRecord"
    post:
      operationId: registerWebhook
      summary: Register an outgoing webhook for mailbox events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                to:
                  type: string
                  description: Only deliver messages addressed to this name.
                event:
                  type: string
                  enum:
                    - message.created
                    - channel.message.created
                channelId:
                  type: string
                  description: Only deliver events for this channel when event is channel.message.created.
                secret:
                  type: string
                  description: Optional HMAC signing secret.
      responses:
        "201":
          description: Registered webhook. Includes the secret once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRecord"
  /api/webhooks/{id}/test:
    post:
      operationId: testWebhook
      summary: Send a test delivery to a webhook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test delivery result.
  /api/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      summary: Delete an outgoing webhook.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
  /api/files/{id}/download:
    get:
      operationId: downloadFile
      summary: Download an uploaded file by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes.
  /api/files/{id}/history:
    get:
      operationId: getFileHistory
      summary: List the version history for an uploaded file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version chain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/files/{id}/versions:
    post:
      operationId: uploadFileVersion
      summary: Upload a new version for an existing file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                commitMessage:
                  type: string
      responses:
        "201":
          description: Uploaded file version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/files/{id}:
    patch:
      operationId: updateFileMetadata
      summary: Update category, tags, and note for an uploaded file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                note:
                  type: string
                project:
                  type: string
                path:
                  type: string
                commitMessage:
                  type: string
      responses:
        "200":
          description: Updated file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
  /api/jobs:
    get:
      operationId: listJobs
      summary: List durable queue jobs.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [queued, claimed, in_progress, blocked, completed] } }
        - { name: device, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200":
          description: Queue jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/JobRecord" }
    post:
      operationId: enqueueJob
      summary: Enqueue or deduplicate a durable job.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "201": { description: Job created. }
        "200": { description: Existing deduplicated job returned. }
  /api/jobs/claim:
    post:
      operationId: claimJob
      summary: Claim a queued job for a device and session lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, session]
              properties:
                id: { type: string }
                device: { type: string }
                session: { type: string }
                project: { type: string }
                kind: { type: string }
                leaseSeconds: { type: integer }
      responses:
        "200": { description: Job claimed. }
        "204": { description: No eligible job. }
  /api/jobs/retry-stale:
    post:
      operationId: retryStaleJobs
      summary: Requeue expired leases or block exhausted jobs.
      responses:
        "200": { description: Recovered jobs. }
  /api/jobs/{id}:
    get:
      operationId: getJob
      summary: Get one durable queue job.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Durable job. }
        "404": { description: Job not found. }
    patch:
      operationId: updateJob
      summary: Transition an owned job and attach structured outputs.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobUpdate" }
      responses:
        "200": { description: Updated job. }
  /api/jobs/{id}/heartbeat:
    post:
      operationId: heartbeatJob
      summary: Renew an owned job lease.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, session]
              properties:
                device: { type: string }
                session: { type: string }
                leaseSeconds: { type: integer }
      responses:
        "200": { description: Lease renewed. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    FileRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        uploadedAt:
          type: string
          format: date-time
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        note:
          type: string
        project:
          type: string
        path:
          type: string
        version:
          type: integer
        parentId:
          type: string
        commitMessage:
          type: string
        downloadUrl:
          type: string
          format: uri
    ProjectRecord:
      type: object
      properties:
        name:
          type: string
        files:
          type: integer
        versions:
          type: integer
        latestUpload:
          type: string
    MessageRecord:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        project:
          type: string
        relatedFileId:
          type: string
        relatedUrl:
          type: string
          format: uri
        readAt:
          type: string
    ChannelRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    ChannelMessageRecord:
      type: object
      properties:
        id:
          type: string
        channelId:
          type: string
        from:
          type: string
        body:
          type: string
        createdAt:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        relatedFileId:
          type: string
        relatedUrl:
          type: string
          format: uri
        readAt:
          type: string
    WebhookRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        event:
          type: string
        to:
          type: string
        channelId:
          type: string
        createdAt:
          type: string
          format: date-time
        hasSecret:
          type: boolean
        secret:
          type: string
    JobCreate:
      type: object
      required: [dedupeKey, title]
      properties:
        id: { type: string }
        dedupeKey: { type: string }
        title: { type: string }
        kind: { type: string }
        project: { type: string }
        priority: { type: number }
        maxAttempts: { type: integer }
        staleAfterSeconds: { type: integer }
        payload: { type: object, additionalProperties: true }
    JobUpdate:
      type: object
      required: [device, session, state]
      properties:
        device: { type: string }
        session: { type: string }
        state: { type: string, enum: [queued, in_progress, blocked, completed] }
        note: { type: string }
        blockedReason: { type: string }
        retryAt: { type: string, format: date-time }
        outputs: { type: object, additionalProperties: true }
    JobRecord:
      type: object
      properties:
        id: { type: string }
        dedupeKey: { type: string }
        title: { type: string }
        kind: { type: string }
        project: { type: string }
        state: { type: string, enum: [queued, claimed, in_progress, blocked, completed] }
        assignedDevice: { type: string }
        assignedSession: { type: string }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lease: { type: object, additionalProperties: true }
        outputs: { type: object, additionalProperties: true }
        transitions: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
