openapi: 3.1.0
info:
  title: Private Filedrop API
  version: 1.0.0
  description: API for listing, uploading, and downloading private file-drop documents.
servers:
  - url: https://your-render-service.onrender.com
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check whether the file-drop service is running.
      security: []
      responses:
        "200":
          description: Service status.
  /api/files:
    get:
      operationId: listFiles
      summary: List uploaded files.
      responses:
        "200":
          description: Uploaded files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/upload:
    post:
      operationId: uploadFile
      summary: Upload a file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                project:
                  type: string
                path:
                  type: string
                commitMessage:
                  type: string
      responses:
        "201":
          description: Uploaded file metadata.
          content:
            application/json:
                  schema:
                    $ref: "#/components/schemas/FileRecord"
  /api/projects:
    get:
      operationId: listProjects
      summary: List project buckets.
      responses:
        "200":
          description: Project summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectRecord"
  /api/files/{id}/download:
    get:
      operationId: downloadFile
      summary: Download an uploaded file by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File bytes.
  /api/files/{id}/history:
    get:
      operationId: getFileHistory
      summary: List the version history for an uploaded file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version chain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileRecord"
  /api/files/{id}/versions:
    post:
      operationId: uploadFileVersion
      summary: Upload a new version for an existing file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                commitMessage:
                  type: string
      responses:
        "201":
          description: Uploaded file version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/files/{id}:
    patch:
      operationId: updateFileMetadata
      summary: Update category, tags, and note for an uploaded file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                note:
                  type: string
                project:
                  type: string
                path:
                  type: string
                commitMessage:
                  type: string
      responses:
        "200":
          description: Updated file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    FileRecord:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        uploadedAt:
          type: string
          format: date-time
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        note:
          type: string
        project:
          type: string
        path:
          type: string
        version:
          type: integer
        parentId:
          type: string
        commitMessage:
          type: string
        downloadUrl:
          type: string
          format: uri
    ProjectRecord:
      type: object
      properties:
        name:
          type: string
        files:
          type: integer
        versions:
          type: integer
        latestUpload:
          type: string
