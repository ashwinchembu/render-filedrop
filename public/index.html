<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private Filedrop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">Private file bridge</p>
          <h1>Files</h1>
        </div>
        <label class="password">
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" />
        </label>
      </section>

      <section class="workspace">
        <aside class="upload-panel">
          <h2>Upload</h2>
          <form id="uploadForm">
            <label>
              File
              <input id="file" name="file" type="file" required />
            </label>
            <label>
              Category
              <input id="category" name="category" type="text" placeholder="Work, lease, receipts" />
            </label>
            <label>
              Project
              <input id="project" name="project" type="text" placeholder="Client docs, taxes, laptop transfer" />
            </label>
            <label>
              Path
              <input id="path" name="path" type="text" placeholder="contracts/vendor-agreement.pdf" />
            </label>
            <label>
              Tags
              <input id="tags" name="tags" type="text" placeholder="tax, signed, urgent" />
            </label>
            <label>
              Commit message
              <input id="commitMessage" name="commitMessage" type="text" placeholder="Initial upload" />
            </label>
            <label>
              Note
              <textarea id="note" name="note" rows="3" placeholder="Quick reminder"></textarea>
            </label>
            <button type="submit">Upload</button>
          </form>
          <div id="status" class="status" role="status"></div>
        </aside>

        <section class="files-panel">
          <div class="files-header">
            <div>
              <h2>Library</h2>
              <p id="summary">Enter the password to load files.</p>
            </div>
            <div class="filters">
              <input id="search" type="search" placeholder="Search files" />
              <select id="groupBy">
                <option value="day">Group by day</option>
                <option value="month">Group by month</option>
                <option value="category">Group by category</option>
                <option value="project">Group by project</option>
              </select>
              <button id="refresh" type="button">Refresh</button>
            </div>
          </div>
          <div id="files" class="files-empty">No files loaded.</div>
        </section>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
