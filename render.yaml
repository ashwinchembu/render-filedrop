services:
  - type: web
    name: private-filedrop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /tmp/filedrop
      - key: MAX_UPLOAD_MB
        value: 250
      - key: UPLOAD_PASSWORD
        generateValue: true
      - key: API_KEY
        generateValue: true
