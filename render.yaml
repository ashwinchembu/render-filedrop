services:
  - type: web
    name: private-filedrop
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: private-filedrop-data
      mountPath: /var/data/filedrop
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /var/data/filedrop
      - key: MAX_UPLOAD_MB
        value: 250
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_PREFIX
        value: filedrop
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: UPLOAD_PASSWORD
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: TELEGRAM_APPROVAL_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_APPROVAL_CHAT_ID
        sync: false
      - key: TELEGRAM_APPROVAL_BOT_TOKEN
        sync: false
